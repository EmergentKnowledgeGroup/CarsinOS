<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc"><title id="title">CarsinOS - The Glass Office</title><desc id="desc">Claw mark and four elevator floors: The Office, The Window, The Trenches, and The Basement.</desc><rect width="1600" height="420" rx="24" fill="#0B0B0E"/><rect x="1" y="1" width="1598" height="418" rx="23" fill="none" stroke="#3A3A3F"/><g transform="translate(70 54)"><g transform="translate(0 0) scale(1.6)"><path d="M36 11 A17 17 0 1 0 36 29 L30 26 A11 11 0 1 1 30 14 Z M36 11 L26 15 l3.4 2.6 L25 20 l4.4 2.4 L26 25 l10 4 A17 17 0 0 0 36 11 Z" fill="#FF5A1F" fill-rule="evenodd" transform="rotate(-14 20 20)"/><path d="M14 9 l5 4 l-4 3 l5 4" fill="none" stroke="#0B0B0E" stroke-width="1.7" transform="rotate(-14 20 20)"/><path d="M20 16.5 l7 3.5 l-7 3.5" fill="none" stroke="#F7F6F3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="86" y="44" font-family="Georgia,serif" font-size="42" fill="#F7F6F3">Carsin<tspan fill="#FF5A1F">OS</tspan></text><text x="0" y="157" font-family="Georgia,serif" font-size="60" fill="#F7F6F3">Give your AI an office.</text><text x="0" y="211" font-family="Segoe UI,sans-serif" font-size="25" fill="#B3B2AE">Brief. Delegate. Decide. Let the floor keep moving.</text><text x="0" y="284" font-family="Segoe UI,sans-serif" font-size="16" letter-spacing="3" fill="#FF5A1F">LOCAL FIRST / OPEN SOURCE / YOUR CONTROL</text></g><path d="M1080 54V366" stroke="#3A3A3F"/><g font-family="Segoe UI,sans-serif"><circle cx="1140" cy="85" r="21" fill="#1A1A1D" stroke="#58B6A9"/><text x="1140" y="91" text-anchor="middle" font-size="18" fill="#58B6A9">4</text><text x="1182" y="92" font-size="25" fill="#F7F6F3">The Office</text><circle cx="1140" cy="161" r="21" fill="#1A1A1D" stroke="#3A3A3F"/><text x="1140" y="167" text-anchor="middle" font-size="18" fill="#58B6A9">3</text><text x="1182" y="168" font-size="25" fill="#F7F6F3">The Window</text><circle cx="1140" cy="237" r="21" fill="#1A1A1D" stroke="#3A3A3F"/><text x="1140" y="243" text-anchor="middle" font-size="18" fill="#58B6A9">2</text><text x="1182" y="244" font-size="25" fill="#F7F6F3">The Trenches</text><circle cx="1140" cy="313" r="21" fill="#1A1A1D" stroke="#3A3A3F"/><text x="1140" y="319" text-anchor="middle" font-size="18" fill="#58B6A9">B</text><text x="1182" y="320" font-size="25" fill="#F7F6F3">The Basement</text></g></svg>
