<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">CarsinOS - The Glass Office</title><desc id="desc">An office for your AI. Brief, delegate, decide. Local-first open-source software.</desc><rect width="1200" height="630" fill="#0B0B0E"/><path d="M72 475H1128" stroke="#3A3A3F"/><g transform="translate(72 62)"><g transform="translate(0 0) scale(1.6)"><path d="M36 11 A17 17 0 1 0 36 29 L30 26 A11 11 0 1 1 30 14 Z M36 11 L26 15 l3.4 2.6 L25 20 l4.4 2.4 L26 25 l10 4 A17 17 0 0 0 36 11 Z" fill="#FF5A1F" fill-rule="evenodd" transform="rotate(-14 20 20)"/><path d="M14 9 l5 4 l-4 3 l5 4" fill="none" stroke="#0B0B0E" stroke-width="1.7" transform="rotate(-14 20 20)"/><path d="M20 16.5 l7 3.5 l-7 3.5" fill="none" stroke="#F7F6F3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="86" y="44" font-family="Georgia,serif" font-size="42" fill="#F7F6F3">Carsin<tspan fill="#FF5A1F">OS</tspan></text><text x="0" y="207" font-family="Georgia,serif" font-size="66" fill="#F7F6F3">Give your AI an office.</text><text x="0" y="270" font-family="Segoe UI,sans-serif" font-size="28" fill="#B3B2AE">Brief. Delegate. Decide.</text><text x="0" y="313" font-family="Segoe UI,sans-serif" font-size="28" fill="#B3B2AE">Let the floor keep moving.</text><text x="0" y="485" font-family="Segoe UI,sans-serif" font-size="18" letter-spacing="3" fill="#FF5A1F">LOCAL FIRST / OPEN SOURCE / YOUR CONTROL</text></g></svg>
